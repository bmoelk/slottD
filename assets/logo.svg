<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Glowing Warm Gradients -->
    <linearGradient id="warmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD043" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>

    <linearGradient id="warmGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <linearGradient id="slotRailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E0B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="slotInnerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#FF8A00" opacity="0.18" filter="url(#glow)" />

  <!-- Horizontal Slot Guide Rail -->
  <g filter="url(#glow)">
    <!-- Rail outer frame -->
    <path d="M 96 232 H 416 C 424.8 232 432 239.2 432 248 V 264 C 432 272.8 424.8 280 416 280 H 96 C 87.2 280 80 272.8 80 264 V 248 C 80 239.2 87.2 232 96 232 Z" 
          fill="none" stroke="url(#slotRailGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Rail inner cutout channel -->
    <rect x="92" y="246" width="328" height="20" rx="4" fill="url(#slotInnerGrad)" stroke="#FFB74D" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Main Interlocking 'D' Segments -->
  <g filter="url(#glow)">
    <!-- Vertical Spine Left Facets (Top-to-Bottom) -->
    <!-- Segment 1 (Top Left Triangle/Trapezoid) -->
    <path d="M 160 128 L 210 128 L 210 178 L 160 178 Z" fill="url(#warmGrad1)" />
    <!-- Segment 2 (Upper Diagonal) -->
    <path d="M 160 186 L 210 186 L 210 238 L 160 238 Z" fill="url(#warmGrad2)" />
    <!-- Segment 3 (Lower Diagonal) -->
    <path d="M 160 274 L 210 274 L 210 326 L 160 326 Z" fill="url(#warmGrad2)" />
    <!-- Segment 4 (Bottom Left) -->
    <path d="M 160 334 L 210 334 L 210 384 L 160 384 Z" fill="url(#warmGrad1)" />

    <!-- Top Horizontal Bar -->
    <path d="M 218 128 H 256 V 178 H 218 Z" fill="url(#warmGrad1)" />
    <path d="M 264 128 H 304 V 178 H 264 Z" fill="url(#warmGrad2)" />

    <!-- Top Right Curved Arc Blocks -->
    <path d="M 312 128 C 348 132 376 156 384 186 L 344 204 C 338 188 326 178 312 178 Z" fill="url(#warmGrad1)" />
    
    <!-- Right Middle Curve Block -->
    <path d="M 386 196 C 398 226 398 240 398 240 L 348 240 C 348 232 344 218 340 210 Z" fill="url(#warmGrad2)" />
    <path d="M 398 272 C 398 272 398 286 386 316 L 340 302 C 344 294 348 280 348 272 Z" fill="url(#warmGrad2)" />

    <!-- Bottom Right Curved Arc Blocks -->
    <path d="M 384 326 C 376 356 348 380 312 384 V 334 C 326 334 338 324 344 308 Z" fill="url(#warmGrad1)" />

    <!-- Bottom Horizontal Bar -->
    <path d="M 264 334 H 304 V 384 H 264 Z" fill="url(#warmGrad2)" />
    <path d="M 218 334 H 256 V 384 H 218 Z" fill="url(#warmGrad1)" />

    <!-- Center Keyway Notch / Slot Interlock -->
    <rect x="210" y="248" width="86" height="16" rx="3" fill="#FFE082" opacity="0.95" />
  </g>

  <!-- Highlight Accents & Edge Polishing -->
  <path d="M 162 130 H 208 M 218 130 H 302" stroke="#FFF9C4" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="210" cy="256" r="3" fill="#FFF9C4" />
  <circle cx="296" cy="256" r="3" fill="#FFF9C4" />
</svg>
