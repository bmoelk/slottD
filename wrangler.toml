# wrangler.toml (Public Open-Source Template)
# Zero secrets, private account IDs, or custom routes are committed here!
# For private deployments, configure wrangler.overrides.toml

name = "slottd"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Public Non-Sensitive Configuration Defaults
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "*"
ENABLE_PUBLIC_REGISTRATION = "false"

# Local / Default Bindings
[[d1_databases]]
binding = "DB"
database_name = "slottd-db"
database_id = "local-d1-placeholder"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "slottd-media"

# Production Bindings & Secrets (Overridden in wrangler.overrides.toml or Cloudflare Dashboard)
# - D1 binding: DB
# - R2 binding: MEDIA
# - Secrets: JWT_SECRET, PREVIEW_SECRET (set via `npx wrangler secret put`)

[observability]
enabled = true
